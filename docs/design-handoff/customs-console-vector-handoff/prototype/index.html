<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关单核验台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-directory-settings" viewBox="0 0 24 24">
      <path d="M3.5 7.25V6A1.5 1.5 0 0 1 5 4.5h4.55l2.2 2.25H19a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18V7.25ZM7 11h10M9.25 9.65v2.7M7 15.5h10M14.75 14.15v2.7"/>
    </symbol>
    <symbol id="icon-declaration-clean" viewBox="0 0 24 24">
      <path d="M7.25 3.5h6.1l4.4 4.4v11.6a1 1 0 0 1-1 1h-9.5a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1ZM13.35 3.5v4.4h4.4M9.25 12.25l5.5 5.5M14.75 12.25l-5.5 5.5"/>
    </symbol>
    <symbol id="icon-screenshot-clean" viewBox="0 0 24 24">
      <path d="M5.25 4.25h13.5a1.75 1.75 0 0 1 1.75 1.75v12a1.75 1.75 0 0 1-1.75 1.75H5.25A1.75 1.75 0 0 1 3.5 18V6a1.75 1.75 0 0 1 1.75-1.75ZM5.25 18.1l4.3-4.55 3 2.95 2.35-2.45 3.85 4.05M15.7 7.25l3.1 3.1M18.8 7.25l-3.1 3.1"/>
    </symbol>
    <symbol id="icon-recognition" viewBox="0 0 24 24">
      <path d="M8 4H5.75A1.75 1.75 0 0 0 4 5.75V8M16 4h2.25A1.75 1.75 0 0 1 20 5.75V8M20 16v2.25A1.75 1.75 0 0 1 18.25 20H16M8 20H5.75A1.75 1.75 0 0 1 4 18.25V16M9 7h4.75L17 10.25V17H9V7ZM13.75 7v3.25H17M7 13.25h10"/>
    </symbol>
    <symbol id="icon-list-clean" viewBox="0 0 24 24">
      <path d="M4.5 6.25H6M9 6.25h10.5M4.5 11.25H6M9 11.25h10.5M4.5 16.25H6M9 16.25h4M15.25 14.5l4.25 4.25M19.5 14.5l-4.25 4.25"/>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path d="M3 7h7l2 2h9v10H3V7Z"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 3h6l1 4H8l1-4ZM7 7l1 13h8l1-13M10 10v7M14 10v7"/>
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v5h4M9 12h6M9 16h6"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="4" y="4" width="11" height="11" rx="2"/><rect x="9" y="9" width="11" height="11" rx="2"/>
    </symbol>
    <symbol id="icon-money" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M8.5 7.5 12 11l3.5-3.5M12 11v7M8.5 13h7"/>
    </symbol>
    <symbol id="icon-check-circle" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-7"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.3 15.3 4.7 4.7"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="icon-empty" viewBox="0 0 64 64">
      <rect x="10" y="6" width="34" height="44" rx="6"/><path d="M19 19h16M19 27h16M19 35h10"/>
      <circle cx="45" cy="46" r="11" class="surface-fill"/><path d="M45 40v12M39 46h12"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>
  </svg>

  <header class="app-bar" data-component="app-bar">
    <div class="brand" aria-label="关单核验台">
      <img src="../assets/icons/app-icon-40.png" width="40" height="40" alt="">
      <span>关单核验台</span>
    </div>
    <div class="window-controls" aria-hidden="true">
      <span class="window-minimize"></span>
      <span class="window-maximize"></span>
      <span class="window-close"></span>
    </div>
  </header>

  <main class="app-content">
    <section class="overview" aria-labelledby="overview-title">
      <div class="section-toolbar">
        <h1 id="overview-title">关单概览</h1>
        <div class="global-actions" aria-label="目录操作">
          <button class="button button-tonal" id="open-directory-settings" type="button">
            <svg aria-hidden="true"><use href="#icon-directory-settings"></use></svg>
            <span>目录设置</span>
          </button>
          <span class="action-divider" aria-hidden="true"></span>
          <button class="button button-danger-text" id="clear-declaration-directory" type="button">
            <svg aria-hidden="true"><use href="#icon-declaration-clean"></use></svg>
            <span>关单清理</span>
          </button>
          <span class="action-divider" aria-hidden="true"></span>
          <button class="button button-danger-text" id="clear-screenshot-directory" type="button">
            <svg aria-hidden="true"><use href="#icon-screenshot-clean"></use></svg>
            <span>截图清理</span>
          </button>
        </div>
      </div>

      <div class="stats-grid" aria-label="关单统计">
        <article class="stat-card" data-stat="total">
          <div class="stat-heading">
            <span class="stat-icon stat-icon-blue"><svg aria-hidden="true"><use href="#icon-document"></use></svg></span>
            <h2>本批关单</h2>
          </div>
          <p class="stat-value"><span id="total-count">0</span><small>份</small></p>
          <p class="stat-helper">总共关单数量</p>
        </article>
        <article class="stat-card" data-stat="duplicates">
          <div class="stat-heading">
            <span class="stat-icon stat-icon-red"><svg aria-hidden="true"><use href="#icon-copy"></use></svg></span>
            <h2>重复单号</h2>
          </div>
          <p class="stat-value"><span id="duplicate-count">0</span><small>个</small></p>
          <p class="stat-helper">重复单号数量</p>
        </article>
        <article class="stat-card" data-stat="price-before">
          <div class="stat-heading">
            <span class="stat-icon stat-icon-purple"><svg aria-hidden="true"><use href="#icon-money"></use></svg></span>
            <h2>去重前总价</h2>
          </div>
          <p class="stat-value"><span id="price-before">—</span></p>
          <p class="stat-helper">按币种分别合计</p>
        </article>
        <article class="stat-card" data-stat="price-after">
          <div class="stat-heading">
            <span class="stat-icon stat-icon-green"><svg aria-hidden="true"><use href="#icon-check-circle"></use></svg></span>
            <h2>去重后总价</h2>
          </div>
          <p class="stat-value"><span id="price-after">—</span></p>
          <p class="stat-helper">按币种分别合计</p>
        </article>
      </div>
    </section>

    <section class="records-panel" aria-labelledby="records-title">
      <header class="records-header">
        <div class="records-heading">
          <h2 id="records-title">关单记录</h2>
          <span id="record-count">共 0 条记录</span>
        </div>
        <div class="records-actions">
          <button class="button button-primary" id="start-recognition" type="button">
            <svg aria-hidden="true"><use href="#icon-recognition"></use></svg>
            <span>开始识别</span>
          </button>
          <button class="button button-danger-text" id="clear-list" type="button">
            <svg aria-hidden="true"><use href="#icon-list-clean"></use></svg>
            <span>列表清理</span>
          </button>
        </div>
      </header>

      <div class="filter-bar">
        <label class="field search-field" for="record-search">
          <span class="field-label">单号搜索</span>
          <span class="input-shell">
            <svg aria-hidden="true"><use href="#icon-search"></use></svg>
            <input id="record-search" type="search" placeholder="输入报关单编号搜索" autocomplete="off">
          </span>
        </label>

        <div class="field custom-select" data-select="record-filter">
          <span class="field-label" id="record-filter-label">记录筛选</span>
          <button class="select-trigger" id="record-filter-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="record-filter-label record-filter-value">
            <span id="record-filter-value">全部记录</span>
            <svg aria-hidden="true"><use href="#icon-chevron"></use></svg>
          </button>
          <div class="select-menu" role="listbox" aria-labelledby="record-filter-label" tabindex="-1">
            <button class="select-option is-selected" type="button" role="option" aria-selected="true" data-value="all">
              <span>全部记录</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
            <button class="select-option" type="button" role="option" aria-selected="false" data-value="normal">
              <span>正常记录</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
            <button class="select-option" type="button" role="option" aria-selected="false" data-value="duplicate">
              <span>重复单号</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
            <button class="select-option" type="button" role="option" aria-selected="false" data-value="error">
              <span>核验异常</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
          </div>
        </div>

        <div class="field custom-select compact-select" data-select="page-size">
          <span class="field-label" id="page-size-label">每页显示</span>
          <button class="select-trigger" id="page-size-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="page-size-label page-size-value">
            <span id="page-size-value">50 条</span>
            <svg aria-hidden="true"><use href="#icon-chevron"></use></svg>
          </button>
          <div class="select-menu" role="listbox" aria-labelledby="page-size-label" tabindex="-1">
            <button class="select-option" type="button" role="option" aria-selected="false" data-value="20">
              <span>20 条</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
            <button class="select-option is-selected" type="button" role="option" aria-selected="true" data-value="50">
              <span>50 条</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
            <button class="select-option" type="button" role="option" aria-selected="false" data-value="100">
              <span>100 条</span><svg aria-hidden="true"><use href="#icon-check"></use></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="table-region" role="region" aria-label="关单记录表格" data-row-height="56" tabindex="0">
        <table>
          <thead>
            <tr>
              <th scope="col">序号</th>
              <th scope="col">报关单编号</th>
              <th scope="col">境外收货人</th>
              <th scope="col">合同协议号</th>
              <th scope="col">出境类别</th>
              <th scope="col">目的国</th>
              <th scope="col">关单总货值</th>
              <th scope="col">状态</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state">
          <svg aria-hidden="true"><use href="#icon-empty"></use></svg>
          <p>暂无关单记录</p>
        </div>
      </div>

      <footer class="records-footer">
        <span id="footer-count">共 0 条</span>
        <nav class="pagination" aria-label="表格分页">
          <span>第 1 / 1 页</span>
          <button type="button" class="page-button" aria-label="上一页" disabled><span aria-hidden="true">‹</span></button>
          <button type="button" class="page-button is-current" aria-current="page">1</button>
          <button type="button" class="page-button" aria-label="下一页" disabled><span aria-hidden="true">›</span></button>
        </nav>
      </footer>
    </section>
  </main>

  <dialog class="dialog directory-dialog" id="directory-dialog" aria-labelledby="directory-dialog-title">
    <form method="dialog" id="directory-form">
      <header class="dialog-header">
        <div>
          <h2 id="directory-dialog-title">目录设置</h2>
          <p>分别设置关单读取目录与核验截图保存目录</p>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭目录设置">
          <svg aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </header>

      <div class="dialog-content">
        <div class="path-field">
          <label for="declaration-path">关单读取目录</label>
          <div class="path-row">
            <div class="path-display">
              <svg aria-hidden="true"><use href="#icon-folder"></use></svg>
              <input id="declaration-path" type="text" placeholder="尚未选择关单读取目录" readonly>
            </div>
            <button class="button button-tonal" id="choose-declaration-directory" type="button">选择目录</button>
          </div>
        </div>

        <div class="path-field">
          <label for="screenshot-path">截图保存目录</label>
          <div class="path-row">
            <div class="path-display">
              <svg aria-hidden="true"><use href="#icon-folder"></use></svg>
              <input id="screenshot-path" type="text" placeholder="尚未选择截图保存目录" readonly>
            </div>
            <button class="button button-tonal" id="choose-screenshot-directory" type="button">选择目录</button>
          </div>
        </div>
        <p class="dialog-helper" id="directory-helper">路径仅保存在当前设备，可随时重新设置。</p>
      </div>

      <footer class="dialog-footer">
        <button class="button button-outlined" value="cancel">取消</button>
        <button class="button button-primary" id="save-directory-settings" value="default">保存设置</button>
      </footer>
    </form>
  </dialog>

  <dialog class="dialog confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog">
      <div class="confirm-heading">
        <span class="confirm-icon"><svg aria-hidden="true"><use href="#icon-trash"></use></svg></span>
        <h2 id="confirm-title">确认清理？</h2>
      </div>
      <p id="confirm-message">此操作不可撤销。</p>
      <div class="warning-panel" id="confirm-warning"></div>
      <footer class="dialog-footer">
        <button class="button button-outlined" value="cancel">取消</button>
        <button class="button button-danger" id="confirm-action" value="default">确认清理</button>
      </footer>
    </form>
  </dialog>

  <input id="declaration-directory-picker" type="file" webkitdirectory directory hidden>
  <input id="screenshot-directory-picker" type="file" webkitdirectory directory hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
