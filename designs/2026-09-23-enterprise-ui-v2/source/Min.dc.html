<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>最小窗口 1200×720</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 720px; overflow: hidden; font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif; color: #0F1B2D;">
<dc-import name="Main" width="1200" height="720" hint-size="1200px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
